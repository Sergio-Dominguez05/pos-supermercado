name: Reporte de error
description: Registrar un defecto reproducible
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué ocurre?
      description: Describa el problema sin incluir credenciales ni datos reales.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |-
        1. Abrir ...
        2. Ejecutar ...
        3. Observar ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno y evidencia
      description: Versión, navegador, logs saneados y capturas sin información confidencial.
    validations:
      required: false
