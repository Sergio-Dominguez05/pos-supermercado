name: Tarea técnica
description: Infraestructura, CI, configuración o documentación
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Criterios para cerrar la tarea
      placeholder: |-
        - [ ] Resultado verificable 1
        - [ ] Resultado verificable 2
    validations:
      required: true
