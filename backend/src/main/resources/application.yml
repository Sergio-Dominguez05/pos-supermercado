spring:
  application:
    name: pos-backend
  profiles:
    default: dev
  autoconfigure:
    # La autenticación es propia (tabla usuario + sesion); sin esto Spring Boot crea un usuario
    # en memoria e imprime su contraseña en el log.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo define Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Guatemala

server:
  port: ${POS_BACKEND_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

pos:
  version: '@project.version@'
  seguridad:
    # Secure en la cookie de sesión: solo funciona con HTTPS (producción).
    cookie-segura: false
    admin-inicial:
      # Si no existe ningún Administrador, se crea 'admin' con esta contraseña temporal (vacía: no se crea).
      contrasena: ''
  fel:
    # simulado: CertificadorFelSimulado (desarrollo y pruebas). rest: adaptador real (pendiente, Sprint 4).
    modo: simulado
    simulador:
      # ACEPTAR, RECHAZAR o SIN_CONEXION, para probar certificación, rechazos y contingencia.
      escenario: ACEPTAR
